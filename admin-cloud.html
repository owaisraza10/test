<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud C2 — Remote OS Quarantine Manager</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #07090e; color: #f8fafc; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #ef4444; font-size: 22px; margin-bottom: 4px; }
    p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .status-banner { 
      background: #111827; padding: 14px 16px; border-radius: 10px; 
      border: 1px solid #1f2937; margin-bottom: 20px; font-size: 13px; 
      color: #60a5fa; font-family: monospace; display: flex; align-items: center; justify-content: space-between;
    }
    .status-dot { height: 10px; width: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #22c55e; margin-right: 8px;}
    table { width: 100%; border-collapse: collapse; background: #111827; border-radius: 10px; overflow: hidden; border: 1px solid #1f2937; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #1f2937; font-size: 13px; }
    th { background: #1f2937; color: #cbd5e1; text-transform: uppercase; font-size: 11px; }
    .badge-active { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 4px 8px; border-radius: 999px; font-weight: 600; font-size: 11px; }
    .badge-disarmed { background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 4px 8px; border-radius: 999px; font-weight: 600; font-size: 11px; }
    .btn-lift { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .btn-lift:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>☁️ CLOUD C2 COMMAND CENTER</h1>
    <p>Live Telemetry & Remote Quarantine Management</p>

    <div class="status-banner">
      <div><span class="status-dot"></span> Tunnel Target: <strong>https://perennial-uneasy-hypnotic.ngrok-free.dev</strong></div>
      <div id="connStatus" style="font-size: 11px; color: #94a3b8;">Polling active...</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Session ID</th>
          <th>Reason</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="sessionTable">
        <tr><td colspan="4" style="text-align: center; color: #64748b;">Connecting to cloud daemon...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Hardcoded permanent tunnel URL - zero configuration required
    const BASE_URL = "https://perennial-uneasy-hypnotic.ngrok-free.dev";

    async function fetchSessions() {
      const statusIndicator = document.getElementById("connStatus");
      try {
        const res = await fetch(`${BASE_URL}/api/sessions`);
        const sessions = await res.json();
        const tbody = document.getElementById("sessionTable");
        
        statusIndicator.innerText = "Connected (Syncing)";
        statusIndicator.style.color = "#4ade80";

        if (sessions.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b;">No active lockdowns recorded.</td></tr>`;
          return;
        }

        tbody.innerHTML = sessions.map(s => `
          <tr>
            <td style="font-family: monospace; font-weight: bold; color: #60a5fa;">${s.session_id}</td>
            <td>${s.reason}</td>
            <td><span class="${s.status === 'ACTIVE' ? 'badge-active' : 'badge-disarmed'}">${s.status}</span></td>
            <td>
              ${s.status === 'ACTIVE' 
                ? `<button class="btn-lift" onclick="liftQuarantine('${s.session_id}')">Lift Quarantine</button>` 
                : `<span style="color: #64748b; font-size: 12px;">Resolved</span>`}
            </td>
          </tr>
        `).join("");
      } catch (err) {
        statusIndicator.innerText = "Connection Failed (Check Python/Ngrok)";
        statusIndicator.style.color = "#f87171";
        console.error("Cloud C2 connection failed", err);
      }
    }

    async function liftQuarantine(sessionId) {
      if (!confirm(`Remotely lift quarantine for ${sessionId}?`)) return;

      try {
        await fetch(`${BASE_URL}/api/lift-quarantine?session_id=${sessionId}`);
        fetchSessions();
      } catch (err) {
        alert("Failed to reach cloud daemon.");
      }
    }

    // Auto-poll every 2 seconds
    fetchSessions();
    setInterval(fetchSessions, 2000);
  </script>
</body>
</html>
