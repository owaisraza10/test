<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Federal C2 — Admin Security Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #07090e; color: #f8fafc; padding: 40px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #ef4444; font-size: 26px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; background: #111827; border-radius: 12px; overflow: hidden; border: 1px solid #1f2937; }
    th, td { padding: 16px; text-align: left; border-bottom: 1px solid #1f2937; font-size: 14px; }
    th { background: #1f2937; color: #cbd5e1; text-transform: uppercase; font-size: 12px; }
    .badge-active { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 4px 8px; border-radius: 999px; font-weight: 600; font-size: 12px; }
    .badge-disarmed { background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 4px 8px; border-radius: 999px; font-weight: 600; font-size: 12px; }
    .btn-lift { background: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-lift:hover { background: #b91c1c; }
    .refresh-hint { margin-top: 20px; font-size: 12px; color: #64748b; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ C2 SECURITY COMMAND & CONTROL</h1>
    <p>Live Telemetry & Remote Quarantine Management for OS Takedown Sessions</p>

    <table>
      <thead>
        <tr>
          <th>Session ID</th>
          <th>Violation Reason</th>
          <th>Timestamp</th>
          <th>Status</th>
          <th>Remote Action</th>
        </tr>
      </i></thead>
      <tbody id="sessionTable">
        <tr><td colspan="5" style="text-align: center; color: #64748b;">Loading active telemetry feeds...</td></tr>
      </tbody>
    </table>

    <div class="refresh-hint">
      Auto-polling C2 server every 2 seconds...
    </div>
  </div>

  <script>
    async function fetchSessions() {
      try {
        const res = await fetch("http://127.0.0.1:5050/api/sessions");
        const sessions = await res.json();
        const tbody = document.getElementById("sessionTable");

        if (sessions.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #64748b;">No security violations recorded yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = sessions.map(s => `
          <tr>
            <td style="font-family: monospace; font-weight: bold; color: #60a5fa;">${s.session_id}</td>
            <td>${s.reason}</td>
            <td style="color: #94a3b8; font-size: 12px;">${s.timestamp}</td>
            <td><span class="${s.status === 'ACTIVE' ? 'badge-active' : 'badge-disarmed'}">${s.status}</span></td>
            <td>
              ${s.status === 'ACTIVE' 
                ? `<button class="btn-lift" onclick="liftQuarantine('${s.session_id}')">Lift Quarantine</button>` 
                : `<span style="color: #64748b; font-size: 12px;">Resolved</span>`}
            </td>
          </tr>
        `).join("");
      } catch (err) {
        console.error("C2 Server unreachable", err);
      }
    }

    async function liftQuarantine(sessionId) {
      if (!confirm(`Are you sure you want to lift quarantine for session ${sessionId}?`)) return;
      try {
        await fetch(`http://127.0.0.1:5050/api/lift-quarantine?session_id=${sessionId}`);
        fetchSessions();
      } catch (err) {
        alert("Failed to communicate with C2 server.");
      }
    }

    // Poll every 2 seconds
    fetchSessions();
    setInterval(fetchSessions, 2000);
  </script>
</body>
</html>
